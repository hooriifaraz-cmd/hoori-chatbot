<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hoori Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #f4f1ff;
      --muted: #b9b3d6;
      --g1: #ff5fa2;
      --g2: #8b5cf6;
      --g3: #3dd6ff;
      --glass: rgba(255, 255, 255, 0.09);
      --glass-line: rgba(255, 255, 255, 0.18);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: #120f24;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      width: 70vmax;
      height: 70vmax;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      z-index: 0;
      pointer-events: none;
    }
    body::before {
      background: radial-gradient(circle, var(--g1), transparent 65%);
      top: -25vmax; left: -20vmax;
      animation: drift1 14s ease-in-out infinite alternate;
    }
    body::after {
      background: radial-gradient(circle, var(--g3), transparent 65%);
      bottom: -28vmax; right: -22vmax;
      animation: drift2 16s ease-in-out infinite alternate;
    }
    @keyframes drift1 { to { transform: translate(18vmax, 14vmax); } }
    @keyframes drift2 { to { transform: translate(-16vmax, -12vmax); } }

    header, #messages, #chat-form { position: relative; z-index: 1; }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      padding-top: calc(14px + env(safe-area-inset-top, 0px));
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--glass-line);
    }
    .logo {
      width: 46px; height: 46px; flex: none;
      border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.55);
      animation: floaty 2.6s ease-in-out infinite;
    }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    .title {
      font-family: "Fredoka", sans-serif;
      font-weight: 600;
      font-size: 1.25rem;
      line-height: 1.1;
    }
    .status { font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 3px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px #4ade80; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .row { display: flex; align-items: flex-end; gap: 8px; animation: pop 0.28s ease-out; }
    .row.me { justify-content: flex-end; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.97); } to { opacity: 1; transform: none; } }

    .avatar {
      width: 32px; height: 32px; flex: none;
      border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid var(--glass-line);
    }
    .msg {
      max-width: 78%;
      padding: 11px 15px;
      border-radius: 20px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .msg.me {
      background: linear-gradient(135deg, var(--g1), var(--g2));
      color: #fff;
      border-bottom-right-radius: 6px;
      box-shadow: 0 6px 18px rgba(255, 95, 162, 0.3);
    }
    .msg.bot {
      background: var(--glass);
      border: 1px solid var(--glass-line);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom-left-radius: 6px;
    }
    .reaction { font-size: 15px; align-self: flex-end; margin-bottom: 2px; }

    .typing { display: flex; gap: 5px; padding: 15px 16px; }
    .typing span {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted);
      animation: bounce 1s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-6px); opacity: 1; } }

    #chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0 4px 40px; }
    .chip {
      font-family: inherit;
      font-size: 14px;
      color: var(--ink);
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--glass-line);
      background: var(--glass);
      cursor: pointer;
    }
    .chip:active { background: rgba(255, 255, 255, 0.2); }

    #chat-form {
      display: flex;
      gap: 8px;
      margin: 8px 12px calc(12px + env(safe-area-inset-bottom, 0px));
      padding: 7px;
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-line);
      border-radius: 30px;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    #chat-form:focus-within {
      border-color: var(--g3);
      box-shadow: 0 0 0 4px rgba(61, 214, 255, 0.25);
    }
    #input {
      flex: 1; min-width: 0;
      font-family: inherit;
      font-size: 16px;
      padding: 10px 14px;
      border: none; outline: none;
      background: transparent;
      color: var(--ink);
    }
    #input::placeholder { color: var(--muted); }
    #send {
      width: 46px; height: 46px; flex: none;
      border: none; border-radius: 50%;
      font-size: 20px; color: #fff; cursor: pointer;
      background: linear-gradient(135deg, var(--g1), var(--g2), var(--g3));
      box-shadow: 0 6px 18px rgba(139, 92, 246, 0.5);
    }
    #send:active { transform: scale(0.94); }

    @media (prefers-reduced-motion: reduce) {
      body::before, body::after, .row, .typing span, .logo { animation: none; }
    }
  </style>
</head>
<body>

  <!-- Robot drawing, defined once and reused -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="faceGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ff5fa2"/>
        <stop offset="50%" stop-color="#8b5cf6"/>
        <stop offset="100%" stop-color="#3dd6ff"/>
      </linearGradient>
      <symbol id="robot" viewBox="0 0 40 40">
        <line x1="20" y1="4" x2="20" y2="9" stroke="#f4f1ff" stroke-width="2" stroke-linecap="round"/>
        <circle cx="20" cy="3.5" r="2.2" fill="#ffd166"/>
        <rect x="6" y="9" width="28" height="24" rx="12" fill="url(#faceGrad)"/>
        <path d="M12 12 L16 15 L12 18 Z" fill="#fff" opacity="0.85"/>
        <path d="M12 12 L8 15 L12 18 Z" fill="#fff" opacity="0.85"/>
        <circle cx="12" cy="15" r="1.4" fill="#ff5fa2"/>
        <circle cx="16.5" cy="21" r="3.1" fill="#fff"/>
        <circle cx="23.5" cy="21" r="3.1" fill="#fff"/>
        <circle cx="16.5" cy="21" r="1.5" fill="#241b3b"/>
        <circle cx="23.5" cy="21" r="1.5" fill="#241b3b"/>
        <circle cx="12.5" cy="25.5" r="1.8" fill="#fff" opacity="0.5"/>
        <circle cx="27.5" cy="25.5" r="1.8" fill="#fff" opacity="0.5"/>
        <path d="M15.5 26.5 Q20 29.5 24.5 26.5" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <header>
    <div class="logo">
      <svg width="34" height="34"><use href="#robot"/></svg>
    </div>
    <div>
      <div class="title">Hoori Chatbot</div>
      <div class="status"><span class="dot"></span>Online</div>
    </div>
  </header>

  <div id="messages"></div>

  <div id="chat-form">
    <input id="input" type="text" placeholder="Ask me anything..." autocomplete="off">
    <button id="send" aria-label="Send">&#10148;</button>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    const AVATAR = '<svg width="24" height="24"><use href="#robot"/></svg>';
    const REACTIONS = ["\u{1F49C}", "\u2728", "\u{1F44D}", "\u{1F60A}"];

    function scrollDown() {
      messages.scrollTop = messages.scrollHeight;
    }

    function getGreeting() {
      const hour = new Date().getHours();
      const greetings = {
        morning: ["Good morning! Ready when you are.", "Morning! What's on your mind today?"],
        afternoon: ["Hey there! How's your day going so far?", "Hi! What can I help you with this afternoon?"],
        evening: ["Evening! Had a good day?", "Hey, good to see you. What's up?"],
        night: ["Still up? I'm here if you need anything.", "Hey, night owl. What can I do for you?"]
      };
      let bucket = "morning";
      if (hour >= 12 && hour < 17) bucket = "afternoon";
      else if (hour >= 17 && hour < 22) bucket = "evening";
      else if (hour >= 22 || hour < 5) bucket = "night";
      const options = greetings[bucket];
      return options[Math.floor(Math.random() * options.length)];
    }

    function addMessage(text, who, reaction) {
      const row = document.createElement("div");
      row.className = "row " + who;

      if (who === "bot") {
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.innerHTML = AVATAR;
        row.appendChild(avatar);
      }

      const bubble = document.createElement("div");
      bubble.className = "msg " + who;
      bubble.textContent = text;
      row.appendChild(bubble);

      if (reaction) {
        const emoji = document.createElement("span");
        emoji.className = "reaction";
        emoji.textContent = reaction;
        row.appendChild(emoji);
      }

      messages.appendChild(row);
      scrollDown();
    }

    function showTyping() {
      const row = document.createElement("div");
      row.className = "row bot";
      row.id = "typing-row";
      row.innerHTML =
        '<div class="avatar">' + AVATAR + '</div>' +
        '<div class="msg bot typing"><span></span><span></span><span></span></div>';
      messages.appendChild(row);
      scrollDown();
    }

    function hideTyping() {
      const row = document.getElementById("typing-row");
      if (row) row.remove();
    }

    function pick(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    // Simple smart replies. Later, replace with a real AI call using fetch().
    function localReply(userText) {
      const t = userText.toLowerCase();
      const has = function () {
        for (let i = 0; i < arguments.length; i++) {
          if (t.indexOf(arguments[i]) !== -1) return true;
        }
        return false;
      };

      if (has("joke")) {
        return pick([
          "Why did the computer go to the doctor? It caught a virus!",
          "Why was the math book sad? It had too many problems.",
          "What do you call a sleeping robot? A snore-bot!"
        ]);
      }
      if (has("study", "exam", "homework")) {
        return "Try this: study for 25 minutes, then take a 5 minute break. Repeat 4 times, then rest longer. What subject are you working on?";
      }
      if (has("plan my day", "plan", "schedule", "routine")) {
        return "Let's plan it: 1) pick your top 3 tasks, 2) do the hardest one first, 3) add small breaks, 4) keep the evening free to relax. What are your 3 tasks?";
      }
      if (has("how are you", "how r u", "how are u")) {
        return pick(["I'm doing great, thanks for asking! How about you?", "Feeling bright and ready to chat! How are you?"]);
      }
      if (has("your name", "who are you", "who r u")) {
        return "I'm Hoori Chatbot, your friendly chat buddy!";
      }
      if (has("thank")) {
        return pick(["You're so welcome!", "Anytime! Happy to help.", "My pleasure!"]);
      }
      if (has("bye", "goodnight", "good night", "see you")) {
        return pick(["Bye! Come back soon.", "Take care! Talk to you later."]);
      }
      if (has("help", "what can you do")) {
        return "I can tell jokes, give study tips, help plan your day, or just chat. Try asking me one!";
      }
      if (has("hello", "hi", "hey", "salam", "namaste", "hii")) {
        return pick(["Hey there! How can I help you today?", "Hi! Nice to see you. What's up?", "Hello! What would you like to talk about?"]);
      }
      return pick([
        "Interesting! Tell me more about that.",
        "I'm still learning, but I'd love to hear more. Can you say it another way?",
        "Hmm, I'm not sure about that yet. Try asking for a joke, study tips, or a day plan!"
      ]);
    }

    // Real AI reply via the Netlify Function. Falls back to simple replies if it fails.
    const history = [];
    async function getReply(userText) {
      history.push({ role: "user", content: userText });
      try {
        const res = await fetch("/.netlify/functions/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history })
        });
        if (!res.ok) throw new Error("bad response");
        const data = await res.json();
        history.push({ role: "assistant", content: data.reply });
        return data.reply;
      } catch (e) {
        return localReply(userText);
      }
    }

    function sendMessage(textOverride) {
      const text = (textOverride || input.value).trim();
      if (text === "") return;

      const chipsBox = document.getElementById("chips");
      if (chipsBox) chipsBox.remove();

      addMessage(text, "me");
      input.value = "";
      showTyping();

      getReply(text).then(function (reply) {
        hideTyping();
        const reaction = REACTIONS[Math.floor(Math.random() * REACTIONS.length)];
        addMessage(reply, "bot", reaction);
      });
    }

    sendBtn.addEventListener("click", function () { sendMessage(); });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") sendMessage();
    });

    addMessage(getGreeting(), "bot");

    const chips = document.createElement("div");
    chips.id = "chips";
    ["Tell me a joke", "Help me study", "Plan my day"].forEach(function (label) {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = label;
      chip.addEventListener("click", function () { sendMessage(label); });
      chips.appendChild(chip);
    });
    messages.appendChild(chips);
  </script>
</body>
</html>
